<!DOCTYPE html>
<html lang="en" dir="ltr" data-g="n">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@400;500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== themes: n = neutral (login), f = female, m = male ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-g="n"]{--bg:#EEF0F2;--paper:#FFFFFF;--soft:#E2E8E6;--soft2:#F5F7F7;--accent:#3F7D6E;--deep:#24493F;--ink:#1E2A30;--muted:#66737B;--off:#A3AEB6;--off-soft:#E6EBEE;--line:#D3DAE0;--on:#FFFFFF;--r:20px;--rs:14px;--shadow:0 8px 24px rgba(30,42,48,.08)}
html[data-g="f"]{--bg:#FFF3F6;--paper:#FFFFFF;--soft:#FFDCE7;--soft2:#FFEAF0;--accent:#FF7EA6;--deep:#C2185B;--ink:#4B2240;--muted:#9A7488;--off:#B9A6D6;--off-soft:#EEE7F8;--line:#F6C9D8;--on:#FFFFFF;--r:28px;--rs:18px;--shadow:0 8px 24px rgba(194,24,91,.12)}
html[data-g="m"]{--bg:#E9EDF0;--paper:#FFFFFF;--soft:#D3ECEE;--soft2:#F2F6F7;--accent:#0E9AA7;--deep:#0A4F57;--ink:#111B22;--muted:#5B6973;--off:#97A3AB;--off-soft:#E1E7EA;--line:#C9D3D9;--on:#FFFFFF;--r:10px;--rs:6px;--shadow:0 6px 18px rgba(17,27,34,.10)}
@media (prefers-color-scheme:dark){
  html[data-g="n"]:not([data-theme="light"]){--bg:#171C1F;--paper:#212A2F;--soft:#2C3A38;--soft2:#1D2529;--accent:#6FC2AC;--deep:#A6E3D2;--ink:#E9EEF1;--muted:#9AA7AF;--off:#5F6C74;--off-soft:#2A3338;--line:#35424A;--on:#13201C;--shadow:0 8px 24px rgba(0,0,0,.35)}
  html[data-g="f"]:not([data-theme="light"]){--bg:#2A1622;--paper:#3A1F30;--soft:#5A2C45;--soft2:#46243A;--accent:#FF8FB4;--deep:#FFB3CC;--ink:#FFE8F0;--muted:#C9A3B6;--off:#9E8AC4;--off-soft:#3B2D4A;--line:#5E3450;--on:#3A1F30;--shadow:0 8px 24px rgba(0,0,0,.35)}
  html[data-g="m"]:not([data-theme="light"]){--bg:#0F1418;--paper:#182026;--soft:#1E3A40;--soft2:#141B20;--accent:#22D3C5;--deep:#7EF0E6;--ink:#E8F1F3;--muted:#8D9BA4;--off:#4E5B63;--off-soft:#232D33;--line:#2A353C;--on:#0F1418;--shadow:0 6px 18px rgba(0,0,0,.45)}
}
html[data-g="n"][data-theme="dark"]{--bg:#171C1F;--paper:#212A2F;--soft:#2C3A38;--soft2:#1D2529;--accent:#6FC2AC;--deep:#A6E3D2;--ink:#E9EEF1;--muted:#9AA7AF;--off:#5F6C74;--off-soft:#2A3338;--line:#35424A;--on:#13201C;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-g="f"][data-theme="dark"]{--bg:#2A1622;--paper:#3A1F30;--soft:#5A2C45;--soft2:#46243A;--accent:#FF8FB4;--deep:#FFB3CC;--ink:#FFE8F0;--muted:#C9A3B6;--off:#9E8AC4;--off-soft:#3B2D4A;--line:#5E3450;--on:#3A1F30;--shadow:0 8px 24px rgba(0,0,0,.35)}
html[data-g="m"][data-theme="dark"]{--bg:#0F1418;--paper:#182026;--soft:#1E3A40;--soft2:#141B20;--accent:#22D3C5;--deep:#7EF0E6;--ink:#E8F1F3;--muted:#8D9BA4;--off:#4E5B63;--off-soft:#232D33;--line:#2A353C;--on:#0F1418;--shadow:0 6px 18px rgba(0,0,0,.45)}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s}
html[data-g="f"] body{font-family:"Fredoka","Baloo Bhaijaan 2",ui-rounded,"Segoe UI",sans-serif}
html[data-g="f"][lang="ar"] body{font-family:"Baloo Bhaijaan 2","Fredoka",Tahoma,sans-serif}
html[data-g="m"] h1,html[data-g="m"] h2,html[data-g="m"] .logo{font-weight:800;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:var(--rs)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* bar */
.bar{display:flex;align-items:center;gap:8px;padding:6px 0 14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.35rem;color:var(--deep);display:flex;align-items:center;gap:6px;margin-inline-end:auto}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem}
html[data-g="m"] .chip{border-radius:var(--rs)}
.chip:hover{border-color:var(--accent)}
.sync{border-style:dashed;font-weight:500;font-size:.78rem;cursor:default}

/* gate */
.gate{min-height:85vh;display:grid;place-items:center}
.card{background:var(--paper);border-radius:var(--r);padding:28px 22px;box-shadow:var(--shadow);width:100%;max-width:460px;border:2px solid var(--line)}
.card h1{font-size:2rem;line-height:1.15;margin:6px 0;color:var(--deep)}
.card h2{font-size:1.4rem;line-height:1.25;margin:4px 0 6px}
.center{text-align:center}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.steps i{width:28px;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.field{width:100%;border:2px solid var(--line);border-radius:var(--rs);padding:12px 14px;background:var(--soft2);font-size:1.05rem}
.field:focus{outline:none;border-color:var(--accent)}
label.lb{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 4px}
.btn{border:none;border-radius:var(--rs);padding:12px 20px;font-weight:600;font-size:1rem;background:var(--accent);color:var(--on);box-shadow:0 4px 0 var(--deep)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--deep)}
.btn.soft{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.offc{background:var(--off);color:#fff;box-shadow:0 4px 0 var(--muted)}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1;min-width:130px}
.link{background:none;border:none;color:var(--deep);text-decoration:underline;padding:6px 0;font-size:.9rem}
.err{color:#D2304A;font-size:.9rem;min-height:1.4em;margin:8px 0 0}
html[data-theme="dark"] .err{color:#FF8A9B}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .err{color:#FF8A9B}}
.profiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.choice{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;border:2px solid var(--line);background:var(--soft2);border-radius:var(--rs);padding:12px 14px;width:100%}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt .em{font-size:1.6rem;line-height:1;flex:none}
.opt b{display:block}
.opt small{color:var(--muted);display:block;line-height:1.35}
.gpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.gpick button{border:2px solid var(--line);background:var(--soft2);border-radius:var(--r);padding:22px 10px;font-weight:600;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.gpick button span{font-size:2.4rem;line-height:1}
.gpick button:hover{border-color:var(--accent)}
.box{margin-top:12px;padding:10px 12px;border-radius:var(--rs);background:var(--soft2);border:2px dashed var(--line);font-size:.9rem}
.warn{border-color:#E0A33A;background:rgba(224,163,58,.12)}

/* hero */
.hero{background:var(--paper);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:2px solid var(--line);margin-bottom:16px;position:relative;overflow:hidden}
html[data-g="f"] .hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--soft);opacity:.6}
html[data-g="m"] .hero{border-inline-start:6px solid var(--accent)}
.hero > *{position:relative;z-index:1}
.hero h2{margin:0;font-size:1.6rem;line-height:1.2}
.hero .sub{color:var(--muted);margin:2px 0 14px}
.ribbon{display:flex;flex-wrap:wrap;gap:4px}
.ribbon span{flex:1 0 calc(100%/16 - 4px);max-width:22px;height:10px;border-radius:9px;background:var(--line)}
html[data-g="m"] .ribbon span{border-radius:2px}
.ribbon span.d{background:var(--accent)}
.ribbon span.x{background:var(--off)}
.ribbon span.o{background:repeating-linear-gradient(45deg,var(--line) 0 3px,var(--paper) 3px 6px)}
.stats{display:flex;gap:16px;margin-top:12px;font-size:.92rem;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-size:1.05rem}
.ext{margin-top:14px;padding:12px 14px;border-radius:var(--rs);background:var(--soft);font-size:.92rem}
.ext .btn{margin-top:8px}

/* panels */
.strip{display:grid;gap:12px;margin-bottom:16px}
@media(min-width:620px){.strip.two{grid-template-columns:1fr 1fr}}
.note{background:var(--soft2);border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;font-size:.95rem}
html[data-g="m"] .note{border-style:solid}
.note h3{margin:0 0 4px;font-size:1rem;display:flex;align-items:center;gap:6px}
.note p{margin:0}
.note select{border:2px solid var(--line);background:var(--paper);border-radius:var(--rs);padding:2px 8px;font-size:.85rem;margin-top:8px}
.glasses{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.glass{width:30px;height:36px;border:2px solid var(--accent);border-radius:4px 4px 10px 10px;background:transparent;padding:0;position:relative;overflow:hidden}
.glass.full::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:var(--accent);opacity:.75}
.panel{background:var(--paper);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:2px solid var(--line);margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:1.15rem}
.wnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.wnums div{background:var(--soft2);border-radius:var(--rs);padding:8px 4px}
.wnums b{display:block;font-size:1.3rem;line-height:1.2}
.wnums small{color:var(--muted);font-size:.78rem}
.wbar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 4px}
.wbar div{height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.spark{width:100%;height:70px;margin-top:6px;display:block}
.wadd{display:flex;gap:8px;margin-top:10px}
.wadd .field{padding:8px 12px;font-size:1rem}
.wadd .btn{padding:8px 16px;flex:none}
.wlist{list-style:none;padding:0;margin:10px 0 0;font-size:.9rem}
.wlist li{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.wlist button{border:none;background:none;color:var(--muted);font-size:.9rem;padding:2px 6px}

/* calendar */
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow div{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600;padding-bottom:4px}
.mlabel{grid-column:1/-1;font-size:.82rem;color:var(--muted);margin:10px 4px 2px;font-weight:600}
.day{border:2px solid var(--line);background:var(--soft2);border-radius:var(--rs);padding:6px 2px 4px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;transition:transform .12s}
.day:hover{transform:translateY(-2px);border-color:var(--accent)}
.day .dnum{font-size:.95rem;font-weight:700;line-height:1}
.day .dmon{font-size:.62rem;color:var(--muted);line-height:1}
.day .kind{font-size:1.1rem;line-height:1}
.day .lbl{font-size:.6rem;color:var(--muted);line-height:1}
.day.today{border-color:var(--deep);border-width:3px}
.day.done{background:var(--accent);border-color:var(--accent);color:var(--on)}
.day.done .dmon,.day.done .lbl{color:var(--on)}
.day.missed{background:var(--off-soft);border-color:var(--off)}
.day.offday{background:repeating-linear-gradient(45deg,var(--soft2) 0 6px,var(--paper) 6px 12px);border-style:dashed}
.day .badge{position:absolute;top:-6px;inset-inline-end:-4px;font-size:.85rem}
.day.out{opacity:.3;pointer-events:none;background:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:14px 4px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-inline-end:4px}

/* sheets & modals */
.scrim{position:fixed;inset:0;background:rgba(17,20,24,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim.mid{align-items:center}
@media(min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@media(min-width:700px){.sheet{border-radius:var(--r)}}
.modal{background:var(--paper);border-radius:var(--r);padding:24px 20px;max-width:440px;width:calc(100% - 32px);max-height:90vh;overflow:auto;margin:auto;border:2px solid var(--line);box-shadow:var(--shadow);animation:up .25s ease-out}
.modal .big{font-size:2.8rem;line-height:1;text-align:center}
.modal h2{margin:8px 0;color:var(--deep);font-size:1.4rem;line-height:1.25;text-align:center}
.modal p{margin:8px 0}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.modal{animation:none}.day,body{transition:none}}
.sheet-head{display:flex;align-items:flex-start;gap:10px}
.sheet-head h2{margin:0;font-size:1.5rem;line-height:1.15}
.x{margin-inline-start:auto;border:none;background:var(--soft);width:38px;height:38px;border-radius:50%;font-size:1.1rem;flex:none}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;margin:8px 6px 0 0}
html[data-g="m"] .pill{border-radius:var(--rs)}
.pill.s-done{background:var(--accent);color:var(--on)}
.pill.s-missed{background:var(--off);color:#fff}
.coach{background:var(--paper);border-inline-start:5px solid var(--accent);border-radius:var(--rs);padding:10px 14px;margin:12px 0 0;font-size:.93rem}
.coach + .coach{margin-top:8px}
.prog{height:12px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.prog > div{height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.list{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.item{background:var(--paper);border:2px solid var(--line);border-radius:var(--rs);padding:10px 12px;display:flex;gap:12px;align-items:flex-start}
.item.checked{border-color:var(--accent);background:var(--soft2)}
.item.checked .iname{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.cb{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);background:var(--paper);display:grid;place-items:center;font-size:.95rem;padding:0;color:var(--on)}
html[data-g="m"] .cb{border-radius:6px}
.item.checked .cb{background:var(--accent)}
.iname{font-weight:600;line-height:1.3}
.isets{color:var(--deep);font-weight:600;font-size:.9rem}
.inote{color:var(--muted);font-size:.86rem;margin-top:2px}
.swap{font-size:.75rem;background:var(--soft);border-radius:6px;padding:1px 6px;margin-inline-start:6px;font-weight:500;color:var(--deep)}
.actions{margin-top:20px;background:var(--paper);border-radius:var(--r);padding:16px;border:2px solid var(--line)}
.actions h3{margin:0 0 10px;font-size:1.05rem}
textarea.field{min-height:84px;resize:vertical;margin-top:12px}
.saved-note{background:var(--soft2);border-radius:var(--rs);padding:10px 12px;margin-top:12px;font-size:.92rem}
.saved-note small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--deep);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:40;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <section id="gate" class="gate"><div class="card" id="gateCard"></div></section>

  <section id="app" class="hidden">
    <div class="bar">
      <div class="logo" id="logo"></div>
      <span class="chip sync" id="sync"></span>
      <button class="chip" data-lang-toggle></button>
      <button class="chip" id="bodyBtn"></button>
      <button class="chip" id="logout"></button>
    </div>
    <div class="hero" id="hero"></div>
    <div id="sevBanner"></div>
    <div class="strip two">
      <div class="note"><h3>☁️ <span id="wxTitle"></span></h3><p id="weatherLine"></p><select id="city" aria-label="City"></select></div>
      <div class="note"><h3>💧 <span id="waterTitle"></span></h3><p id="waterLine"></p><div class="glasses" id="glasses"></div></div>
    </div>
    <div class="panel" id="weight"></div>
    <div class="panel">
      <h3 id="calTitle"></h3>
      <div class="dow" id="dow"></div>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
    </div>
    <p class="foot" id="foot"></p>
  </section>
</div>
<div id="sheetRoot"></div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
/* ================= storage ================= */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); if(v!==null) return JSON.parse(v); }catch(e){} return mem[k] ?? null; },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ================= i18n ================= */
let lang = store.get("fit30:lang") || "en";
let G = "n"; // n | f | m
const T = {
 en:{
  brand:{n:"Fit 30",f:"Pink 30",m:"Iron 30"},
  loginSub:"Your 30-day training plan. Enter your username to continue, or pick a new one to start your journey.",
  placeholder:"Username", cont:"Continue", checking:"Looking you up…",
  errName:"Use 3–24 English letters or numbers (_ . - allowed).", savedOn:"Saved on this device:",
  back:"Back", stepOf:(a,b)=>`Step ${a} of ${b}`,
  gTitle:n=>`Nice to meet you, ${n}! Who's training?`, female:"Female", male:"Male",
  wTitle:"Your weight", wSub:"We'll use this to track your progress.", wCur:"Current weight (kg)", wGoal:"Goal weight (kg)",
  errW:"Enter both weights between 30 and 300 kg.",
  pTitle:"Any pain or injuries?", pSub:"Tick everything that bothers you. We'll swap exercises to protect it.",
  pNone:"No pain, all good", pSevere:"The pain is sharp, getting worse, or from a recent injury",
  severeNote:"Please check with a doctor or physiotherapist before you start. Stop any exercise that causes sharp pain.",
  rTitle:"How many strength days per week?", rSub:"The other days are walking, plus one rest day.",
  rDesc:(n,w)=>`${n} strength · ${w} walking · 1 rest`,
  rHint:{2:"Gentle start or busy weeks",3:"Balanced (recommended)",4:"Upper / lower split",5:"Most intense"},
  sTitle:"When do you want to start?", sSub:"You can reset and start over any time.",
  begin:"Start my 30 days", saveBtn:"Save", errDate:"Pick a start date first.",
  extTitle:"Round {n}: how many strength days per week?",
  switchUser:"Switch user", myBody:"My body", startOver:"Reset & start over",
  hello:n=>`Hi ${n}`, dayOf:(d,t)=>`Day ${d} of ${t}`, before:d=>`Your plan starts ${d}. Get ready!`,
  after:"You finished the plan! 🎉", round:n=>`Round ${n}`,
  sDone:"done", sMissed:"not done", sOff:"days off", sStreak:"day streak",
  extHint:"On your last day you'll be able to extend for another 30 days.",
  extReady:"Last day! Want to keep going?", extDone:"Plan finished. Ready for the next round?",
  extBtn:"Extend for 30 more days 🔥", extNote:"The next round steps up: more sets, heavier weights, longer walks.",
  toastExt:(n,d)=>`Round ${n} starts ${d}! 🔥`,
  resetTitle:"Start over?", resetBody:"This clears your plan progress, feedback, days off and water logs. Your weight records stay.",
  resetGo:"Clear & set up again", cancel:"Cancel",

function adapt(list, pains){
  const out = [], seen = new Set();
  list.forEach(([id,sets])=>{
    let cur = id, swapped = false;
    for(let pass=0; pass<3; pass++){
      let changed = false;
      for(const p of pains){ const s = PAINS[p]?.subs; if(s && cur in s){ const nx = s[cur]; if(nx!==cur){ cur = nx; changed = true; swapped = true; } if(cur===null) break; } }
      if(!changed || cur===null) break;
    }
    if(cur===null || seen.has(cur)) return;
    seen.add(cur); out.push({id:cur, sets, swapped});
  });
  return out;
}

    if(i===28){ out.push({type:"R",wk:"FBL",week:w}); continue; }
    if(i===29){ out.push({type:"WM",mins:WALK[c][4],week:w}); continue; }
    const k = pat[i%7];
    if(k==="R"){
      let wk = rot[r % rot.length];
      if(rdays===3 && cycle===1 && r===0) wk = "FBA";
      r++; out.push({type:"R",wk,week:w});
    } else if(k==="W") out.push({type:"W",mins:WALK[c][w],week:w});
    else out.push({type: w%2===1 ? "RW" : "REST", week:w});
  }
  return out;
}
function buildEntries(st){
  const base = baseSessions(st.rdays, st.cycle||1);
  const offs = {}; (st.offs||[]).forEach(o=>offs[o.date]=o);
  const entries = []; let p = 0, carry = null, d = parse(st.start), guard = 0;
  while(p < base.length && guard++ < 400){
    const key = iso(d), off = offs[key];
    if(off && off.mode==="push"){ entries.push({date:key, s:{type:"OFF",mode:"push"}}); d = addDays(d,1); continue; }
    const s = base[p++];
    if(off){ entries.push({date:key, s:{type:"OFF",mode:off.mode,skipped:s}}); if(off.mode==="move" && s.type==="R") carry = {...s, movedFrom:key}; d = addDays(d,1); continue; }
    if(carry && s.type==="W"){ entries.push({date:key, s:carry}); carry = null; }
    else entries.push({date:key, s});
    d = addDays(d,1);
  }
  return entries;
}
function setsFor(sets, s, cycle){
  if(cycle===1 && s.week===0) return sets.replace(/^3 ×/,"2 ×");
  if(cycle>=2) return sets.replace(/^3 ×/,"4 ×").replace(/^2 ×/,"3 ×");
  return sets;
}
function sessionTitle(s){
  if(s.type==="R") return "R · " + WK[s.wk][0];
  if(s.type==="W") return "W · " + num(s.mins) + " " + t("min");
  if(s.type==="WM") return "W · " + num(s.mins) + " " + t("min") + (lang==="ar"?" + قياسات":" + measurements");
  return t("kinds")[s.type];

async function rpc(fn, body, keepalive){
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 8000);
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {method:"POST", keepalive:!!keepalive, signal:ctl.signal,
    headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(body)});

function renderStep(){
  const card = $("#gateCard"), step = wiz.steps[wiz.i], d = wiz.data, last = wiz.i===wiz.steps.length-1;
  const nav = (label) => `<p id="gErr" class="err" role="alert"></p><button id="next" class="btn block">${label || (last ? (wiz.mode==="new"||wiz.mode==="reset" ? t("begin") : t("saveBtn")) : t("cont"))}</button>
    <div class="center"><button class="link" id="prev">${t("back")}</button></div>`;
  let html = stepHead();
  if(step==="gender"){
    html += `<h2 class="center">${esc(t("gTitle", wiz.name))}</h2>
      <div class="gpick"><button data-g="f"><span>👩</span>${t("female")}</button><button data-g="m"><span>👨</span>${t("male")}</button></div>
      <div class="center" style="margin-top:12px"><button class="link" id="prev">${t("back")}</button></div>`;
  } else if(step==="weight"){
    html += `<h2>${t("wTitle")}</h2><p class="muted" style="margin:0">${t("wSub")}</p>

  } else if(step==="pain"){
    if(!d.pains) d.pains = [];
    html += `<h2>${t("pTitle")}</h2><p class="muted" style="margin:0">${t("pSub")}</p>` + painOptions(d.pains, d.severe) + nav();
  } else if(step==="rdays"){
    if(!d.rdays) d.rdays = 3;
    html += `<h2>${wiz.mode==="extend" ? esc(t("extTitle").replace("{n}", num((d.cycle||1)+1))) : t("rTitle")}</h2><p class="muted" style="margin:0">${t("rSub")}</p>` + rdaysOptions(d.rdays)
      + (wiz.mode==="extend" ? `<div class="box">🔥 ${t("extNote")}</div>` : "") + nav();
  } else if(step==="start"){
    html += `<h2>${t("sTitle")}</h2><p class="muted" style="margin:0">${t("sSub")}</p>
      <input id="sd" class="field" type="date" style="margin-top:14px" value="${esc(d.start||todayISO())}" aria-label="${esc(t("sTitle"))}">` + nav();
  }
  card.innerHTML = html;
  const prev = $("#prev");
  if(prev) prev.onclick = () => {
    if(wiz.i>0){ wiz.i--; renderStep(); return; }
    const m = wiz.mode; wiz = null;
    if(m==="new"||m==="fill"){ user = null; renderGate(); } else { showApp(); }
  };
  const go = () => { if(wiz.i < wiz.steps.length-1){ wiz.i++; renderStep(); } else finishWizard(); };
  if(step==="gender") card.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ d.gender = b.dataset.g; setG(d.gender); go(); });
  if(step==="weight") $("#next").onclick = () => {
    const a = parseFloat($("#wc").value), b = parseFloat($("#wg").value);
    if(!(a>=30&&a<=300&&b>=30&&b<=300)){ $("#gErr").textContent = t("errW"); return; }
    d.startW = a; d.goalW = b; if(!d.weights.length) d.weights = [{date:todayISO(), kg:a}]; go();
  };
  if(step==="pain"){ bindPain(d.pains); $("#next").onclick = () => { d.severe = $("#severe").checked; go(); }; }
  if(step==="rdays"){ bindRdays(d); $("#next").onclick = go; }
  if(step==="start") $("#next").onclick = () => { const v = $("#sd").value; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ $("#gErr").textContent = t("errDate"); return; } d.start = v; go(); };
  const first = card.querySelector("input,.gpick button,#next"); if(first) first.focus({preventScroll:true});
}
function finishWizard(){
  const {name, data, mode, push} = wiz; wiz = null;
  if(mode==="extend"){
    const prevEnd = entries.length ? parse(entries[entries.length-1].date) : new Date();
    const nextDay = addDays(prevEnd,1), today = parse(todayISO());
    data.history = data.history || []; data.history.push({cycle:data.cycle, start:data.start, end:iso(prevEnd), rdays:data.rdays_prev||data.rdays});
    data.cycle = (data.cycle||1)+1; data.start = iso(nextDay > today ? nextDay : today); data.offs = [];
    delete data.rdays_prev;
    enter(name, data, true); toast(t("toastExt", num(data.cycle), fmtDate(parse(data.start)))); return;
  }
  enter(name, data, true);
}

function stats(){
  let done=0, missed=0, off=0;
  entries.forEach(e=>{ if(e.s.type==="OFF") off++; const st = state.days[e.date]?.status; if(st==="done") done++; else if(st==="missed") missed++; });
  const ti = entries.findIndex(e=>e.date===todayISO()); let streak = 0;
  if(ti>=0) for(let i=ti;i>=0;i--){ const e = entries[i], st = state.days[e.date]?.status; if(e.s.type==="OFF") continue; if(st==="done") streak++; else if(i===ti && !st) continue; else break; }
  return {done, missed, off, streak, ti};
}

/* ---- weight ---- */
function renderWeight(){
  const ws = (state.weights||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const startW = state.startW, goalW = state.goalW, cur = ws.length ? ws[ws.length-1].kg : startW;
  const span = Math.abs(startW-goalW) || 1, moved = goalW<startW ? startW-cur : cur-startW;
  const pct = Math.max(0, Math.min(100, Math.round(moved/span*100)));
  const left = goalW<startW ? cur-goalW : goalW-cur;
  let spark = "";
  if(ws.length>1){
    const vals = ws.map(w=>w.kg).concat([goalW]), mn = Math.min(...vals)-1, mx = Math.max(...vals)+1, W = 300, H = 70;
    const x = i => (i/(ws.length-1))*(W-12)+6, y = v => H-6-((v-mn)/(mx-mn))*(H-12);
    const pts = ws.map((w,i)=>`${x(i).toFixed(1)},${y(w.kg).toFixed(1)}`).join(" ");
    spark = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(t("weightTitle"))}" style="transform:${lang==="ar"?"scaleX(-1)":"none"}">
      <line x1="0" x2="${W}" y1="${y(goalW)}" y2="${y(goalW)}" stroke="var(--off)" stroke-dasharray="4 4"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      ${ws.map((w,i)=>`<circle cx="${x(i)}" cy="${y(w.kg)}" r="3.5" fill="var(--deep)"/>`).join("")}</svg>`;
  }
  $("#weight").innerHTML = `<h3>⚖️ ${t("weightTitle")}</h3>
    <div class="wnums"><div><b>${kgFmt(startW)}</b><small>${t("start")} (${t("kg")})</small></div><div><b>${kgFmt(cur)}</b><small>${t("now")} (${t("kg")})</small></div><div><b>${kgFmt(goalW)}</b><small>${t("goal")} (${t("kg")})</small></div></div>
    <div class="wbar"><div style="width:${pct}%"></div></div>
    <div class="muted" style="font-size:.88rem">${left<=0 ? t("reached") : t("toGo", kgFmt(left))} · ${num(pct)}%</div>
    ${spark}
    <div class="wadd"><input id="wIn" class="field" type="number" inputmode="decimal" step="0.1" min="30" max="300" placeholder="${esc(t("wPh"))} (${t("kg")})" aria-label="${esc(t("wPh"))}"><button class="btn" id="wAdd">${t("add")}</button></div>
    <p class="err" id="wErr" role="alert" style="min-height:0"></p>
    <ul class="wlist">${ws.slice(-5).reverse().map(w=>`<li><span>${esc(fmtDate(parse(w.date)))}</span><span><b>${kgFmt(w.kg)}</b> ${t("kg")} <button data-wd="${w.date}" aria-label="Delete">✕</button></span></li>`).join("")}</ul>`;
  const add = () => {
    const v = parseFloat($("#wIn").value);
    if(!(v>=30 && v<=300)){ $("#wErr").textContent = t("errW2"); return; }
    const k = todayISO(); state.weights = (state.weights||[]).filter(w=>w.date!==k); state.weights.push({date:k, kg:v});
    persist(); renderWeight(); toast(t("toastW"));
  };
  $("#wAdd").onclick = add; $("#wIn").onkeydown = e => { if(e.key==="Enter") add(); };
  document.querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{ state.weights = state.weights.filter(w=>w.date!==b.dataset.wd); persist(); renderWeight(); });
}

function renderSheet(date){
  const idx = entries.findIndex(e=>e.date===date); if(idx<0){ closeSheet(); return; }

  const ds = state.days[date] || {}; ds.checks = ds.checks || {};
  const {items, notes} = dayDetail(e);
  const total = items.length, doneN = items.filter(it=>ds.checks[it.id]).length, pct = total ? Math.round(doneN/total*100) : 0;
  const canOff = ["R","W","WM"].includes(s.type) && date >= todayISO() && ds.status!=="done";

  let actions = "";
  if(off){
    actions = `<button class="btn soft block" id="undoOff">${t("undoOff")}</button>`;

      ${ds.status ? `<button class="link" id="clearAct">${t("clear")}</button>` : ""}
      ${canOff ? `<div style="margin-top:14px"><button class="btn soft block" id="offBtn">${t("dayOff")}</button></div>` : ""}`;
  }
  $("#sheetRoot").innerHTML = `<div class="scrim" id="sScrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">

      <div class="muted" style="font-size:.9rem">${t("dayN",num(idx+1))} · ${esc(fmtDate(parse(date)))}</div>
      <h2 id="sTitle">${esc(off ? t("offName") : sessionTitle(s))}</h2>
      <span class="pill">${kindIcon(s)} ${esc(t("kinds")[s.type])}</span>${pill}
    </div><button class="x" id="sClose" aria-label="Close">✕</button></div>
    ${notes.map(n=>`<div class="coach">${esc(n)}</div>`).join("")}
    ${items.length ? `<div style="font-weight:600;margin-top:14px">${t("checklist")}</div>
    <div class="prog" aria-hidden="true"><div style="width:${pct}%"></div></div>
    <div class="muted" style="font-size:.85rem">${t("of",num(doneN),num(total))}</div>
    <ul class="list">${items.map(it=>`<li class="item${ds.checks[it.id]?" checked":""}">
      <button class="cb" data-check="${it.id}" role="checkbox" aria-checked="${!!ds.checks[it.id]}" aria-label="${esc(it.name)}">${ds.checks[it.id]?"✓":""}</button>
      <div><div class="iname">${esc(it.name)}${it.swapped?`<span class="swap">${t("adjusted")}</span>`:""}</div>${it.sets?`<div class="isets">${esc(it.sets)}</div>`:""}${it.note?`<div class="inote">${esc(it.note)}</div>`:""}</div></li>`).join("")}</ul>` : ""}
    <div class="actions">${actions}</div></div></div>`;

  const keep = fn => () => { const sh = $(".sheet"), sc = sh.scrollTop; fn(); const n = $(".sheet"); if(n) n.scrollTop = sc; };
  const on = (id,fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on("sClose", closeSheet);
  $("#sScrim").onclick = ev => { if(ev.target.id==="sScrim") closeSheet(); };
  document.querySelectorAll("[data-check]").forEach(b=>b.onclick = keep(()=>{ ds.checks[b.dataset.check] = !ds.checks[b.dataset.check]; state.days[date] = ds; persist(); renderSheet(date); }));
  on("doDone", keep(()=>{ mode="done"; renderSheet(date); $("#noteIn").focus(); }));
  on("doMissed", keep(()=>{ mode="missed"; renderSheet(date); $("#noteIn").focus(); }));
  on("cancelAct", keep(()=>{ mode=null; renderSheet(date); }));
  on("clearAct", keep(()=>{ delete ds.status; delete ds.note; delete ds.at; state.days[date] = ds; persist(); toast(t("toastClear")); renderSheet(date); }));
  on("saveAct", ()=>{
    const v = $("#noteIn").value.trim();

    ds.status = mode; ds.note = v; ds.at = Date.now();

function openOff(date, s){
  let choice = "push";
  const opts = [["push","⏭️",t("offPush"),t("offPushD")],["skip","✂️",t("offSkip"),t("offSkipD")]];
  if(s.type==="R") opts.push(["move","🔁",t("offMove"),t("offMoveD")]);
  modal(`<div class="big">🛑</div><h2>${t("offTitle")}</h2><p class="muted center">${esc(fmtDate(parse(date)))} · ${esc(sessionTitle(s))}</p><p style="font-weight:600">${t("offQ")}</p>
    <div class="choice" id="offList">${opts.map(([k,em,a,b])=>`<button class="opt ${k===choice?"sel":""}" data-o="${k}" aria-pressed="${k===choice}"><span class="em">${em}</span><span><b>${a}</b><small>${b}</small></span></button>`).join("")}</div>
    <div class="row" style="margin-top:16px"><button class="btn" id="oGo">${t("offGo")}</button><button class="btn soft" id="oNo">${t("cancel")}</button></div>`);
  document.querySelectorAll("#offList [data-o]").forEach(b=>b.onclick=()=>{ choice = b.dataset.o; document.querySelectorAll("#offList [data-o]").forEach(x=>{ const on = x.dataset.o===choice; x.classList.toggle("sel",on); x.setAttribute("aria-pressed",on); }); });
  $("#oNo").onclick = closeModal;
  $("#oGo").onclick = () => {
    state.offs = (state.offs||[]).filter(o=>o.date!==date); state.offs.push({date, mode:choice, at:Date.now()});
    const ds = state.days[date]; if(ds){ delete ds.status; delete ds.note; }
    persist(); closeModal(); toast(t("toastOff")); renderApp(); renderSheet(date);
  };
}

/* ================= boot ================= */
applyLang(); renderGate();
const last = store.get("fit30:last");
if(last && cleanName(last)) lookup(last);
window.addEventListener("pagehide", ()=>{ clearTimeout(saveTimer); flush(true); });
})();
</script>
